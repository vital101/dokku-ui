[package]
name = "dokku-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Server-rendered management UI for Dokku"
license = "MIT"

[dependencies]
actix-files = "0.6"
actix-web = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }