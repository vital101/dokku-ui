[package]
name = "dokku-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Server-rendered management UI for Dokku"
license = "MIT"

[dependencies]
actix-files = "0.6"
actix-web = "4"
askama = "0.16"
async-trait = "0.1"
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"