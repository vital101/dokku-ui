{% if available %}
<div class="rounded-lg border border-slate-800 bg-slate-900/50 p-4">
  <div class="flex items-center justify-between text-sm">
    <span class="text-slate-400">Host disk</span>
    <span class="text-white">
      {{ used_label }} used of {{ total_label }}
      <span class="text-slate-500">({{ avail_label }} free)</span>
    </span>
  </div>
  {% if let Some(percent) = percent %}
  <progress value="{{ percent }}" max="100" class="mt-2 h-1.5 w-full accent-sky-500"></progress>
  {% endif %}
</div>
{% endif %}
