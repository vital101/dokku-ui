{% if rows.is_empty() %}
<p class="mt-4 text-sm text-slate-400">No activity yet.</p>
{% else %}
<table class="mt-4 w-full text-left text-sm">
  <thead>
    <tr class="border-b border-slate-800 text-slate-400">
      <th class="py-2 pr-4 font-medium">When</th>
      <th class="py-2 pr-4 font-medium">Action</th>
      <th class="py-2 pr-4 font-medium">Target</th>
      <th class="py-2 pr-4 font-medium">Actor</th>
      <th class="py-2 font-medium">Outcome</th>
    </tr>
  </thead>
  <tbody>
    {% for row in rows %}
    <tr class="border-b border-slate-800/50">
      <td class="py-2 pr-4 font-mono text-slate-400">{{ row.formatted_when() }}</td>
      <td class="py-2 pr-4 font-mono text-white">{{ row.operation }}</td>
      <td class="py-2 pr-4 font-mono text-slate-300">{{ row.subject }}</td>
      <td class="py-2 pr-4 font-mono text-slate-300">{{ row.actor_email_label() }}</td>
      <td class="py-2 font-mono text-slate-300">{{ row.outcome_label() }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %}
