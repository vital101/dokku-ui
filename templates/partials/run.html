<div data-run class="flex h-full min-h-0 flex-col"
     data-run-url="{{ run_url }}"
     {% if let Some(refresh_url) = refresh_url %}data-refresh="{{ refresh_url }}"{% endif %}>
  <div class="flex shrink-0 items-center gap-3 border-b border-slate-800 px-5 py-4">
    <span data-run-spinner
          class="size-4 animate-spin rounded-full border-2 border-slate-600 border-t-emerald-400"></span>
    <h3 class="text-sm font-medium text-white">{{ title }}</h3>
  </div>
  <pre data-run-log
       class="min-h-0 flex-1 overflow-auto whitespace-pre-wrap break-all bg-slate-950 p-4 text-xs leading-relaxed text-slate-300"></pre>
  <div data-run-outcome class="mx-5 mt-4 hidden shrink-0 rounded-md border px-4 py-3 text-sm"></div>
  <div class="flex shrink-0 justify-end px-5 py-4">
    <button type="button" data-run-close
            class="rounded-md bg-slate-800 px-4 py-2 text-sm font-medium text-slate-200 hover:bg-slate-700">
      Close
    </button>
  </div>
</div>
