{% if !rows.is_empty() %}
<div class="space-y-2">
  {% for row in rows %}
  <div class="rounded-md border border-slate-800 bg-slate-900 px-4 py-3 shadow-lg">
    <div class="flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p class="truncate font-mono text-xs text-slate-300">{{ row.label }}</p>
        <p class="text-xs {% if row.state_label == "failed" %}text-red-400{% elif row.state_label == "succeeded" %}text-emerald-400{% else %}text-slate-400{% endif %}">
          {{ row.state_label }}
        </p>
      </div>
      {% if row.state_label == "succeeded" || row.state_label == "failed" %}
      {% if !row.acked %}
      <form hx-post="/actions/runs/{{ row.run_id }}/ack"
            hx-target="#toast-tray" hx-swap="innerHTML" method="post">
        <input type="hidden" name="csrf_token" value="{{ row.csrf_token }}">
        <button type="submit"
                class="rounded-md bg-slate-800 px-2 py-1 text-xs font-medium text-slate-200 hover:bg-slate-700">
          Dismiss
        </button>
      </form>
      {% endif %}
      {% endif %}
    </div>
  </div>
  {% endfor %}
</div>
{% endif %}
