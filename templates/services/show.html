{% extends "services/base_service.html" %}

{% block service_content %}
<div class="space-y-6">
  <div id="app-panel"
       hx-get="/services/{{ plugin }}/{{ service }}/partials/overview"
       hx-trigger="load"
       hx-swap="innerHTML">
    {% include "partials/loading.html" %}
  </div>

  <div class="flex flex-wrap gap-3">
    <form method="post" action="/services/{{ plugin }}/{{ service }}/start"
          hx-post="/services/{{ plugin }}/{{ service }}/start" hx-target="#modal-content" hx-swap="innerHTML"
          data-action-form>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit"
              class="app-action rounded-md bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700">
        <span class="app-action-label">Start</span>
      </button>
    </form>
    <form method="post" action="/services/{{ plugin }}/{{ service }}/stop"
          hx-post="/services/{{ plugin }}/{{ service }}/stop" hx-target="#modal-content" hx-swap="innerHTML"
          data-action-form>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit"
              class="app-action rounded-md bg-amber-600 px-4 py-2 text-sm font-medium text-white hover:bg-amber-700">
        <span class="app-action-label">Stop</span>
      </button>
    </form>
    <form method="post" action="/services/{{ plugin }}/{{ service }}/restart"
          hx-post="/services/{{ plugin }}/{{ service }}/restart" hx-target="#modal-content" hx-swap="innerHTML"
          data-action-form>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit"
              class="app-action rounded-md bg-slate-700 px-4 py-2 text-sm font-medium text-white hover:bg-slate-600">
        <span class="app-action-label">Restart</span>
      </button>
    </form>
    <a href="/services/{{ plugin }}/{{ service }}/delete"
       hx-get="/services/{{ plugin }}/{{ service }}/partials/delete-confirm" hx-target="#modal-content"
       hx-swap="innerHTML"
       class="app-action rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700">
      Destroy service
    </a>
  </div>
</div>
{% endblock %}
