{% extends "base.html" %}

{% block title %}{{ name }} — Dokku UI{% endblock %}
{% block heading %}{{ name }}{% endblock %}

{% block content %}
<nav class="mb-6 flex gap-1 border-b border-slate-800">
  <a href="/apps/{{ name }}"
     class="rounded-t-md px-3 py-2 text-sm font-medium {% if active_tab == "overview" %}border-b-2 border-emerald-500 text-white{% else %}text-slate-400 hover:text-white{% endif %}">
    Overview
  </a>
  <a href="/apps/{{ name }}/processes"
     class="rounded-t-md px-3 py-2 text-sm font-medium {% if active_tab == "processes" %}border-b-2 border-emerald-500 text-white{% else %}text-slate-400 hover:text-white{% endif %}">
    Processes
  </a>
  <a href="/apps/{{ name }}/services"
     class="rounded-t-md px-3 py-2 text-sm font-medium {% if active_tab == "services" %}border-b-2 border-emerald-500 text-white{% else %}text-slate-400 hover:text-white{% endif %}">
    Services
  </a>
  <a href="/apps/{{ name }}/config"
     class="rounded-t-md px-3 py-2 text-sm font-medium {% if active_tab == "config" %}border-b-2 border-emerald-500 text-white{% else %}text-slate-400 hover:text-white{% endif %}">
    Config
  </a>
  <a href="/apps/{{ name }}/logs"
     class="rounded-t-md px-3 py-2 text-sm font-medium {% if active_tab == "logs" %}border-b-2 border-emerald-500 text-white{% else %}text-slate-400 hover:text-white{% endif %}">
    Logs
  </a>
</nav>
{% block app_content %}{% endblock %}

{% include "partials/modal.html" %}
{% endblock %}
