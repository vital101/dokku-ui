{% extends "apps/base_app.html" %}

{% block app_content %}
<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h3 class="text-sm font-medium text-white">Logs</h3>
    <form hx-get="/apps/{{ name }}/partials/logs" hx-target="#app-panel" hx-swap="innerHTML"
          class="flex items-center gap-2">
      <label for="lines" class="text-sm text-slate-400">Lines</label>
      <input id="lines" type="number" name="lines" min="{{ min_lines }}" max="{{ max_lines }}"
             value="{{ line_count }}"
             class="w-24 rounded-md border border-slate-800 bg-slate-900 px-2 py-1.5 text-sm text-white">
      <button type="submit"
              class="rounded-md bg-slate-800 px-3 py-1.5 text-sm font-medium text-slate-200 hover:bg-slate-700">
        Update
      </button>
    </form>
  </div>
  <div id="app-panel"
       hx-get="/apps/{{ name }}/partials/logs?lines={{ line_count }}"
       hx-trigger="load"
       hx-swap="innerHTML">
    {% include "apps/partials/loading.html" %}
  </div>
</div>
{% endblock %}
