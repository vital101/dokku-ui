<div data-modal>
  <div class="border-b border-red-900/60 bg-red-950/30 px-5 py-4">
    <h3 class="text-sm font-medium text-white">Delete {{ name }}</h3>
  </div>
  <div class="px-5 py-4">
    <p class="text-sm text-slate-400">
      Are you sure you want to delete <span class="font-mono text-white">{{ name }}</span>? This
      action cannot be undone.
    </p>
    <form method="post" action="/apps/{{ name }}/delete"
          hx-post="/apps/{{ name }}/delete" hx-target="#modal-content" hx-swap="innerHTML"
          data-action-form class="mt-4 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div>
        <label for="confirm-name" class="block text-sm font-medium text-slate-300">
          Type <span class="font-mono text-white">{{ name }}</span> to confirm
        </label>
        <input id="confirm-name" name="name" type="text" required autocomplete="off"
               class="mt-1 block w-full rounded-md border-slate-700 bg-slate-800 text-white placeholder-slate-500 sm:text-sm"
               placeholder="{{ name }}">
      </div>
      <div class="flex justify-end gap-3">
        <button type="button" data-modal-close
                class="rounded-md border border-slate-700 px-4 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800">
          Cancel
        </button>
        <button type="submit"
                class="app-action rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700">
          <span class="app-action-label">Yes, delete app</span>
        </button>
      </div>
    </form>
  </div>
</div>
