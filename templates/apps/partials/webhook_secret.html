<div class="flex items-center gap-2">
  <input id="webhook-secret-field" type="text" readonly value="{{ secret }}"
         class="w-full flex-1 rounded-md border border-slate-800 bg-slate-900 px-3 py-2 font-mono text-xs text-slate-200">
  <button type="button" data-copy="webhook-secret-field" data-copy-label="Copy"
          class="rounded-md bg-slate-800 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700">
    Copy
  </button>
</div>
<p class="mt-2 text-xs text-amber-400">
  Copy the secret into GitHub's webhook settings now — it is only shown while
  your re-auth window is active.
</p>
