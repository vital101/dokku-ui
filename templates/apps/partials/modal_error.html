<div data-modal-error>
  <div class="border-b border-slate-800 px-5 py-4">
    <h3 class="text-sm font-medium text-white">Action failed</h3>
  </div>
  <p class="px-5 py-4 text-sm text-red-300">{{ message }}</p>
  <div class="flex justify-end px-5 py-4">
    <button type="button" data-modal-close
            class="rounded-md bg-slate-800 px-4 py-2 text-sm font-medium text-slate-200 hover:bg-slate-700">
      Close
    </button>
  </div>
</div>
