{% if lines.is_empty() %}
<div class="rounded-lg border border-slate-800 bg-slate-900/50 p-6">
  <p class="text-sm text-slate-400">No log lines yet.</p>
</div>
{% else %}
<pre class="max-h-[70vh] overflow-auto rounded-lg border border-slate-800 bg-slate-950 p-4 text-xs leading-relaxed text-slate-300">{% for line in lines %}{{ line }}
{% endfor %}</pre>
{% endif %}
