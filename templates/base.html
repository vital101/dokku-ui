<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dokku UI{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <link rel="stylesheet" href="/static/css/app.css">
  <!-- Disables htmx's auto-injected indicator <style> tag, which the CSP
       (style-src 'self', no unsafe-inline) would block. -->
  <meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="flex min-h-screen">
    <nav class="w-56 shrink-0 border-r border-slate-800 p-4">
      <a href="/" class="mb-6 block text-lg font-semibold text-white">Dokku UI</a>
      <ul class="space-y-1 text-sm">
        <li>
          <a href="/" class="block rounded-md px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white">Apps</a>
        </li>
        <li>
          <a href="/activity" class="block rounded-md px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white">Activity</a>
        </li>
        <li id="admin-nav" hx-get="/partials/admin-nav" hx-trigger="load" hx-swap="outerHTML"></li>
      </ul>
      <p class="mt-6 mb-2 px-3 text-xs font-medium uppercase tracking-wide text-slate-500">Services</p>
      <ul class="space-y-1 text-sm">
        <li id="service-nav" hx-get="/partials/service-nav" hx-trigger="load" hx-swap="outerHTML"></li>
      </ul>
      <p class="mt-6 mb-2 px-3 text-xs font-medium uppercase tracking-wide text-slate-500">Storage</p>
      <ul class="space-y-1 text-sm">
        <li>
          <a href="/volumes" class="block rounded-md px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white">Volumes</a>
        </li>
      </ul>
    </nav>
    <div class="flex-1">
      <header class="flex h-14 items-center justify-between border-b border-slate-800 px-6">
        <h1 class="text-sm font-medium text-slate-300">{% block heading %}{% endblock %}</h1>
        <form method="post" action="/logout" class="flex items-center gap-3">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="button" data-theme-toggle class="rounded-md bg-slate-800 px-3 py-1.5 text-sm font-medium text-slate-200 hover:bg-slate-700">Theme</button>
          <a href="/password" class="text-sm text-slate-400 hover:text-slate-200">{{ email }}</a>
          <button type="submit" class="rounded-md bg-slate-800 px-3 py-1.5 text-sm font-medium text-slate-200 hover:bg-slate-700">Log out</button>
        </form>
      </header>
      <main class="p-6">
        {% if let Some(flash) = flash %}
        <div class="mb-4 rounded-md border px-4 py-3 text-sm {{ flash.level.css_class() }}">
          {{ flash.message }}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  <div id="toast-tray"
       class="fixed right-4 bottom-4 z-50 w-80 space-y-2"
       hx-get="/actions/toasts"
       hx-trigger="load, every 5s"
       hx-swap="innerHTML">
  </div>
  <div data-palette-overlay
       class="fixed inset-0 z-50 items-start justify-center bg-slate-950/70 pt-24">
    <div class="w-full max-w-lg rounded-lg border border-slate-800 bg-slate-900 p-3 shadow-xl">
      <input data-palette-input type="text" placeholder="Search apps and pages… (Ctrl+K)"
             class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white placeholder-slate-500 focus:border-slate-500 focus:outline-none">
      <ul data-palette-results class="mt-2 max-h-80 space-y-1 overflow-y-auto"></ul>
    </div>
  </div>
  <template data-palette-item-template>
    <li>
      <a data-palette-link href="#"
         class="flex items-center justify-between rounded-md px-3 py-2 text-sm text-slate-300 hover:bg-slate-800 hover:text-white">
        <span data-palette-label></span>
        <span data-palette-group class="text-xs uppercase tracking-wide text-slate-500"></span>
      </a>
    </li>
  </template>
  <script src="/static/js/palette.js" defer></script>
</body>
</html>
