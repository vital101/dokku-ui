<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dokku UI{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <link rel="stylesheet" href="/static/css/app.css">
  <!-- Disables htmx's auto-injected indicator <style> tag, which the CSP
       (style-src 'self', no unsafe-inline) would block. -->
  <meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="flex min-h-screen">
    <nav class="w-56 shrink-0 border-r border-slate-800 p-4">
      <a href="/" class="mb-6 block text-lg font-semibold text-white">Dokku UI</a>
      <ul class="space-y-1 text-sm">
        <li>
          <a href="/" class="block rounded-md px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white">Dashboard</a>
        </li>
        <li>
          <a href="/apps/new" class="block rounded-md px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white">Apps</a>
        </li>
      </ul>
      <p class="mt-6 mb-2 px-3 text-xs font-medium uppercase tracking-wide text-slate-500">Services</p>
      <ul class="space-y-1 text-sm">
        <li>
          <a href="/services/postgres" class="block rounded-md px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white">PostgreSQL</a>
        </li>
        <li>
          <a href="/services/mysql" class="block rounded-md px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white">MySQL</a>
        </li>
        <li>
          <a href="/services/redis" class="block rounded-md px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white">Redis</a>
        </li>
        <li>
          <a href="/services/mongo" class="block rounded-md px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white">MongoDB</a>
        </li>
      </ul>
      <p class="mt-6 mb-2 px-3 text-xs font-medium uppercase tracking-wide text-slate-500">Storage</p>
      <ul class="space-y-1 text-sm">
        <li>
          <a href="/volumes" class="block rounded-md px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white">Volumes</a>
        </li>
      </ul>
    </nav>
    <div class="flex-1">
      <header class="flex h-14 items-center justify-between border-b border-slate-800 px-6">
        <h1 class="text-sm font-medium text-slate-300">{% block heading %}{% endblock %}</h1>
        <form method="post" action="/logout" class="flex items-center gap-3">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <span class="text-sm text-slate-400">{{ email }}</span>
          <button type="submit" class="rounded-md bg-slate-800 px-3 py-1.5 text-sm font-medium text-slate-200 hover:bg-slate-700">Log out</button>
        </form>
      </header>
      <main class="p-6">
        {% if let Some(flash) = flash %}
        <div class="mb-4 rounded-md border px-4 py-3 text-sm {{ flash.level.css_class() }}">
          {{ flash.message }}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
</body>
</html>
