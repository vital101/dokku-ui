<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dokku UI{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="flex min-h-screen">
    <nav class="w-56 shrink-0 border-r border-slate-800 p-4">
      <a href="/" class="mb-6 block text-lg font-semibold text-white">Dokku UI</a>
      <ul class="space-y-1 text-sm">
        <li>
          <a href="/" class="block rounded-md px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white">Dashboard</a>
        </li>
        <li>
          <a href="/apps/new" class="block rounded-md px-3 py-2 text-slate-300 hover:bg-slate-800 hover:text-white">Apps</a>
        </li>
      </ul>
    </nav>
    <div class="flex-1">
      <header class="flex h-14 items-center justify-between border-b border-slate-800 px-6">
        <h1 class="text-sm font-medium text-slate-300">{% block heading %}{% endblock %}</h1>
        <form method="post" action="/logout" class="flex items-center gap-3">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <span class="text-sm text-slate-400">{{ email }}</span>
          <button type="submit" class="rounded-md bg-slate-800 px-3 py-1.5 text-sm font-medium text-slate-200 hover:bg-slate-700">Log out</button>
        </form>
      </header>
      <main class="p-6">
        {% if let Some(flash) = flash %}
        <div class="mb-4 rounded-md border px-4 py-3 text-sm {{ flash.level.css_class() }}">
          {{ flash.message }}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
</body>
</html>
