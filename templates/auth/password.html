{% extends "base.html" %}

{% block heading %}Change password{% endblock %}

{% block content %}
<div class="max-w-md">
  {% if let Some(error) = error %}
  <div class="mb-4 rounded-md border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-400">
    {{ error }}
  </div>
  {% endif %}
  <form method="post" action="/password" class="space-y-4 rounded-lg border border-slate-800 bg-slate-900/50 p-6">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div>
      <label for="current-password" class="mb-1 block text-sm font-medium text-slate-300">Current password</label>
      <input id="current-password" name="current_password" type="password" required autofocus
             class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white focus:border-slate-500 focus:outline-none">
    </div>
    <div>
      <label for="new-password" class="mb-1 block text-sm font-medium text-slate-300">New password</label>
      <input id="new-password" name="password" type="password" required minlength="12"
             class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white focus:border-slate-500 focus:outline-none">
      <p class="mt-1 text-xs text-slate-500">At least 12 characters.</p>
    </div>
    <div>
      <label for="confirm-password" class="mb-1 block text-sm font-medium text-slate-300">Confirm new password</label>
      <input id="confirm-password" name="confirm" type="password" required minlength="12"
             class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white focus:border-slate-500 focus:outline-none">
    </div>
    <button type="submit"
            class="rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">
      Update password
    </button>
  </form>
</div>
{% endblock %}
